document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;if(t.dataset.tab==="plan")S.day=null;render();scrollTo(0,0);return;}
  if(t.dataset.day!==undefined){S.tab="plan";S.day=+t.dataset.day;render();scrollTo(0,0);return;}
  if(t.dataset.go==="plan"){S.day=null;render();scrollTo(0,0);return;}
  if(t.dataset.toggle){const y=scrollY;S.done[t.dataset.toggle]=!S.done[t.dataset.toggle];render();scrollTo(0,y);return;}
  if(t.dataset.flag){const y=scrollY;S.flag[t.dataset.flag]=!S.flag[t.dataset.flag];render();scrollTo(0,y);return;}
  if(t.dataset.r){const el=document.getElementById(t.dataset.r);const open=el.hidden;el.hidden=!open;t.setAttribute("aria-expanded",open);return;}
  if(t.dataset.deck){S.deck=t.dataset.deck;S.ci=0;S.flip=false;render();return;}
  if(t.hasAttribute("data-flip")){S.flip=!S.flip;render();return;}
  if(t.dataset.card){const n=(S.deck==="complex"?COMPLEX:CARDS).length;S.ci=(S.ci+ +t.dataset.card+n)%n;S.flip=false;render();return;}
  if(t.dataset.ed){const id=t.dataset.ed,el=document.getElementById("ed"+id);const open=el.hidden;el.hidden=!open;t.setAttribute("aria-expanded",open);open?OPEN.add(id):OPEN.delete(id);if(open){const ta=el.querySelector("textarea");ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length);}return;}
  if(t.dataset.run){runTests(t);return;}
  if(t.dataset.restart){const id=t.dataset.restart,ta=document.querySelector(`textarea[data-code="${id}"]`);if(confirm("Replace your code with the starter?")){ta.value=starter(ta.dataset.name);delete CODE[id];saveCode();document.getElementById("st"+id).textContent="Starter code";}return;}
  if(t.hasAttribute("data-reset")){if(confirm("Clear all solved marks, flags and saved code?")){S.done={};S.flag={};CODE={};saveCode();OPEN.clear();render();}}
});

const BRY=new URL(".",location.href).href.replace(/\/$/,"");
const PY={state:"idle"};
const RESULTS={};
function pyStatusText(){
  return {idle:"Python loading…",loading:"Python loading…",ready:"Python ready",
    error:"Python didn't load. Open the app once while online.",
    blocked:"Running code isn't supported in this view."}[PY.state];
}
function updatePy(){
  document.querySelectorAll(".pystat").forEach(el=>el.textContent=pyStatusText());
  document.querySelectorAll(".runbtn").forEach(b=>{b.disabled=PY.state!=="ready";});
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load failed"));document.head.appendChild(s);});}
async function initPython(){
  if(PY.state!=="idle")return;
  PY.state="loading";updatePy();
  try{new Function("return 1")();}catch(e){PY.state="blocked";updatePy();return;}
  try{
    window.__BRYTHON__=window.__BRYTHON__||{brython_path:BRY+"/"};
    await loadScript(BRY+"/brython.min.js");
    await loadScript(BRY+"/brython_stdlib.js");
    await new Promise(r=>setTimeout(r,30));
    window.brython({debug:0,indexeddb:false});
    window.__BRYTHON__.runPythonSource(PY_HARNESS+"\nfrom browser import window\nwindow.__prepRun = run\n","prepharness");
    if(typeof window.__prepRun!=="function")throw new Error("init failed");
    PY.state="ready";
  }catch(e){PY.state="error";}
  updatePy();
}
function errLine(e){return `<b>${esc(e.type)}${e.line?` on line ${e.line}`:""}</b>: ${esc(e.msg)}`;}
function renderResults(r){
  if(r.fatal)return `<p class="rerr"><b>Couldn't run your code</b>: ${esc(r.fatal)}</p>`;
  if(r.compile)return `<p class="rerr">${errLine(r.compile)}</p>${r.stdout?`<details open><summary>Printed output</summary><pre>${esc(r.stdout)}</pre></details>`:""}`;
  const n=r.cases.length,ok=r.cases.filter(c=>c.ok).length,all=ok===n&&n>0;
  let h=`<p class="rsum ${all?"pass":"fail"}">${all?`All ${n} tests passed`:`${ok} of ${n} tests passed`}</p>`;
  if(r.autoMarked)h+=`<p class="kv" style="margin:0 0 8px">Marked as solved.</p>`;
  h+=`<ul class="rlist">`+r.cases.map(c=>{
    let body=`<code>${esc(c.label)}</code>`;
    if(c.skipped)body+=`<div class="kv">Skipped after the step limit.</div>`;
    else if(c.err)body+=`<div class="kv">Expected <b>${esc(c.exp)}</b></div><div class="kv">${errLine(c.err)}</div>`;
    else if(!c.ok)body+=`<div class="kv">Expected <b>${esc(c.exp)}</b></div><div class="kv">Got <b>${esc(c.got)}</b></div>`;
    return `<li class="${c.ok?"ok":"bad"}"><span class="mk">${c.ok?"✓":"✗"}</span><div>${body}</div></li>`;
  }).join("")+`</ul>`;
  if(r.stdout)h+=`<details><summary>Printed output</summary><pre>${esc(r.stdout)}</pre></details>`;
  return h;
}
function runTests(btn){
  const id=btn.dataset.run,name=btn.dataset.name;
  const ta=document.querySelector(`textarea[data-code="${id}"]`);
  if(PY.state!=="ready"||!ta)return;
  CODE[id]=ta.value;saveCode();
  btn.disabled=true;btn.textContent="Running…";
  setTimeout(()=>{
    let r;
    try{r=JSON.parse(window.__prepRun(ta.value,PY_TESTS[name]));}
    catch(e){r={fatal:String((e&&e.message)||e)};}
    const all=!r.fatal&&!r.compile&&r.cases.length>0&&r.cases.every(c=>c.ok);
    if(all&&!S.done[id]){S.done[id]=true;r.autoMarked=true;}
    RESULTS[id]=r;
    const y=scrollY;render();scrollTo(0,y);
  },40);
}

function insertAt(ta,text){
  const s=ta.selectionStart,e=ta.selectionEnd;
  ta.setRangeText(text,s,e,"end");
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}
function pressKey(ev){
  const b=ev.target.closest("[data-key]");if(!b)return;
  ev.preventDefault(); // keep the textarea focused so the keyboard stays up
  const ta=b.closest(".editor").querySelector("textarea");
  if(document.activeElement!==ta)ta.focus({preventScroll:true});
  insertAt(ta,b.dataset.key==="⇥"?"    ":b.dataset.key);
}
document.addEventListener("touchstart",pressKey,{passive:false});
document.addEventListener("mousedown",pressKey);

document.addEventListener("input",e=>{
  const ta=e.target;if(!ta.dataset||!ta.dataset.code)return;
  const id=ta.dataset.code;CODE[id]=ta.value;
  const st=document.getElementById("st"+id);if(st)st.textContent="Saving…";
  clearTimeout(codeTimer);
  codeTimer=setTimeout(()=>{const ok=saveCode();if(st)st.textContent=ok?"Saved on this phone":"Couldn't save. Storage may be full or blocked.";},400);
});

document.addEventListener("keydown",e=>{
  const ta=e.target;if(!ta.dataset||!ta.dataset.code||e.isComposing)return;
  if(e.key==="Tab"){e.preventDefault();insertAt(ta,"    ");return;}
  if(e.key==="Enter"){
    const v=ta.value,s=ta.selectionStart;
    const lineStart=v.lastIndexOf("\n",s-1)+1,line=v.slice(lineStart,s);
    let indent=line.match(/^ */)[0];
    if(/:\s*(#.*)?$/.test(line))indent+="    ";
    e.preventDefault();insertAt(ta,"\n"+indent);
  }
});
let OFFLINE="none";
function offlineHTML(){
  if(OFFLINE==="ready")return `<p class="offline on">✓ Ready offline</p>`;
  if(OFFLINE==="pending")return `<p class="offline">Saving an offline copy… keep the app open and online for a moment.</p>`;
  return "";
}
async function checkOffline(){
  try{
    const hit=await caches.match(new URL("brython_stdlib.js",location.href).href);
    const next=hit?"ready":"pending";
    if(next!==OFFLINE){OFFLINE=next;if(S.tab==="plan"&&S.day===null)render();}
    if(!hit)setTimeout(checkOffline,1500);
  }catch(e){}
}
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(hadController&&!reloading){reloading=true;location.reload();}
  });
  navigator.serviceWorker.register("sw.js",{scope:"./"}).then(reg=>{
    checkOffline();
    if(navigator.onLine)reg.update().catch(()=>{});
  }).catch(()=>{});
}
render();
setTimeout(initPython,300);
</script>
